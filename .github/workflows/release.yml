name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm --filter @filesniff/core run build
      - run: pnpm --filter @filesniff/web run build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/web/dist/**
