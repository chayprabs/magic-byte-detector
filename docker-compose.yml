services:
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    expose:
      - "8787"
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
      - MAX_UPLOAD_BYTES=52428800
      - RETENTION_MINUTES=5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./packages/web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      worker:
        condition: service_healthy
