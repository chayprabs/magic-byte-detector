services:
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - MAX_UPLOAD_BYTES=52428800
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
